<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mona Lisa Cube Grid</title>
  <style>
    html, body { margin: 0; height: 100%; background: black; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* Header styling */
    #header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(30, 30, 30, 0.8);
      color: white;
      padding: 15px 20px;
      box-sizing: border-box;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
    }
    
    .header-left h1 {
      margin: 0 0 5px 0;
      font-size: 1.2rem;
    }
    
    .header-left .name {
      font-size: 0.9rem;
      color: #aaa;
    }

    .project-info {
      font-size: 0.95rem;
      text-align: right;
      max-width: 400px;
      color: #ddd;
    }

    /* Shifted original controls down to accommodate the header */
    #controls {
      position: absolute;
      top: 85px;
      left: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  
  <div id="header">
    <div class="header-left">
      <h1>Mona Lisa Cube Grid</h1>
      <div class="name">By: Ryan Sippy and Jason Bellerjeau</div>
    </div>
    <div class="project-info">
      A 3D representation of the Mona Lisa using a grid of cubes
    </div>
  </div>

  <div id="controls">
    <button id="moveCameraBtn">Move Camera</button>
  </div>
  
  <canvas id="c"></canvas>
  <script src="index.js"></script>
</body>
</html>
